# This board's display path is the upstream GopFramebuffer component at the base catalog
# revision. Its local checkout is clean against UniXNU/GopFramebuffer main; a board feed
# entry here previously named a commit that did not exist, so it is not repeated.

# QcomXnuUsbDebug is a submodule of this repository (drivers/QcomXnuUsbDebug), built by
# scripts/build-qcom-xnu-usb-debug.py. The base catalog keeps its own entry for the other
# alioth device records and munch; this repository no longer selects that entry.

# The A650 GPU driver and the ArmCpu device branch are submodules of this repository:
# drivers/Adreno650 follows UniXNU/Adreno740, and drivers/ArmCpu follows UniXNU/ArmCpu.
# The base repository's own submodules stay at the upstream revisions, and the resolver
# takes the device repository's directories first.
