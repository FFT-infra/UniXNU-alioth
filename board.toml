schema_version = 2

[board]
name = "alioth"
soc = "SM8250"
soc_source = "sm8250"
os_profile = "ipados-17.7.11-21H461"
description = "Xiaomi Redmi K40 (alioth, M2012K11AC)"
kit = "alioth"

[components]
# ShengHidInput publishes the board touch core's finger set as an IOHIDDevice. It is a board
# driver, pinned as a submodule of this repository (drivers/ShengHidInput) as the device
# repository specification requires. It is not listed below because its build is the one
# exception to the component form: sheng invokes build-sheng-hid-input.py from its display
# recipe and archives the result into the force-loaded late archive, and this board does the
# same (scripts/build-gop-legacy-display.py). Selecting it here as well would run the recipe a
# second time on its own, where it cannot find the reference candidate alias or Homebrew's
# llvm, and its output is never archived by the generic pipeline anyway.
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "ShengUfs", "ShengHidInput", "VirtioMmioBlock", "RamBlock", "GopFramebuffer", "XnuPrelink", "DarwinBoot", "AppleKeyStoreState", "QcomXnuUsbDebug"]

[userdata]
# Android's userdata on UFS LUN 0, read from the phone's GPT.
first_lba = 0x2a8000
last_lba = 0x3b037fa
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "alioth_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8250.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "component:ShengUfs",
  # ShengUfs imports the original IOBlockStorageDevice and IOMedia symbols. IOStorageFamily is
  # prelinked and exports none of them, so this step binds each name to its original absolute
  # address: from the qualified audit when it exists, else from the recorded static derivation
  # in scripts/data/native-storage-original-bindings.S. It must run after the component recipes,
  # because it adds its object to the archive they produce.
  "build-storage-bindings.py --component NativeUfs --archive libShengUfs.a --directory build/sheng-ufs",
  # Selected for root authentication, not for its transport: alioth's DTS has no virtio,mmio node,
  # so the driver never probes. It provides native_verified_block_root_authorized(), which
  # OWNER_ROOT_AUDIT calls, and that function reaches ShengUfs through the weak
  # native_ufs_block_authenticates(). The archive that the kernel links is overridden by
  # CONFIG_XNU_NATIVE_VIRTIO_BLOCK_ARCHIVE (the verified bundle); this step builds the plain one.
  "component:VirtioMmioBlock",
  # Same 12 original storage symbols as ShengUfs, but this object imports only 11 of them, so the
  # recorded file is read as a superset (--subset) instead of requiring an exact match.
  "build-storage-bindings.py --component NativeVirtioBlock --archive libVirtioMmioBlock.a --directory build/virtio-mmio-block --subset",
  "component:RamBlock",
  # The RAM transport publishes the Data volume, so its storage bindings must be present:
  # alioth now sets CONFIG_XNU_NATIVE_RAM_BLOCK, and the kernel link force-loads this archive.
  # With NATIVE_VIRTIO_BLOCK also on, build-xnu-4k-baseline.sh links the bare NativeRamBlock.o
  # and requires this report (bindings.json) to agree with the Virtio one on all 11 shared
  # original symbols. The audit itself comes from scripts/data/native-storage-original-bindings.S,
  # the broadcast static derivation, because no live GDB interface audit exists here yet.
  "build-storage-bindings.py --component NativeRamBlock --archive libRamBlock.a --directory build/ram-block --subset",
  # The OS profile sets CONFIG_XNU_SOURCE_MOCKFS, and build-xnu-4k-baseline.sh:739
  # force-loads build/mockfs-fixture/libmockfs_fixture.a when it is on. Only this
  # archive builds that library, so it must stay in the list.
  "build-mockfs-fixture.py",
  "build-platform-power.py",
  # Ported for stage 4: reads the device package (kits/<kit>) and this board's
  # Mu-Silicium checkout instead of kits/sheng and uefi-sheng.
  "build-boot-progress.py",
  "build-link-stubs.py",
  "build-libpthread-kernel.py",
  "component:AppleKeyStoreState",
  # The GOP display path. Builds libNativeLegacyDisplay.late.a, whose absolute bindings to the
  # prelinked IOMobileFramebufferLegacy are re-proven against this kernel on every run. It must
  # run after the driver recipes above, because it reads their compile records.
  "build-gop-legacy-display.py",
  "build-alioth-pcie.py",
  "build-adreno650.py",
  "component:QcomXnuUsbDebug",
  # Touch. QcomGeniSpi is the GENI SPI controller; ShengHidInput is the IOHIDFamily
  # consumer that turns the probe's native_touch_* seqlock into HID digitizer events.
  # The board's own FocalTech FT5652 probe and protocol come from kits/alioth-touch, built by
  # build-alioth-touch.py. It supplies the finger set only; ShengHidInput below is what turns
  # that into an input device.
  "build-alioth-touch.py",
  # ShengHidInput's recipe produces NativeHidInput.late.o and hid-original-bindings.o. This
  # step builds them; the display recipe below is what archives them into the force-loaded
  # late archive, which is the only reason they link at all. Earlier images compiled
  # NativeHidInput.cpp inside the touch kit's archive, which is not force-loaded, so the
  # linker dropped the object and every image ran the touch core with no HID device at all
  # (boot-usb70: contacts 2, interrupt line low 879 times, hid 0).
  "component:ShengHidInput",
]

[firmware]
config = "alioth"
dsc = "Platforms/Xiaomi/aliothPkg/alioth.dsc"
fd = "Build/aliothPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/check-alioth.py"]
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "1"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "alioth-research"

[payload]
volume = "ALIOTHESP"
# boot_a and boot_b are 192 MiB (0xC000000). A 192 MiB FAT ramdisk plus the
# boot shim, the firmware volume and the appended device tree does not fit;
# 184 MiB also leaves less than the required 8 MiB safety margin. 176 MiB is
# the value the archived alioth port booted on hardware.
# 180 since the Metal staging: the Data seed grew from 1.2 MiB to 40 MiB with
# the plugin bundle and Turnip, the payload files now take 168 MiB, and the
# builder refuses content above 95% of this value. 180 leaves 12 MiB against
# the partition.
size_mib = 180
loader = "firmware"
title = "Boot"
# The board's DRAM from 0x80000000 to the end of the last bank.
dram_size = "0x200000000"
skip_setup_tool = "scripts/seed-data-skip-setup.py"
# The accepted trust cache bundle. Without one, DarwinBoot writes no
# /chosen/memory-map/TrustCache, load_static_trust_cache() finds a zero-length segment,
# and AMFI refuses the first exec: launchd's code signature is not in any loaded cache,
# so mpo_cred_label_update_execve sets ip_mac_return and the kernel kills initproc with
# OS_REASON_EXEC (9) / EXEC_EXIT_REASON_SECURITY_POLICY (0x8).
# The bundle was the two unchanged 21H461 modules, StaticTrustCache then
# Cryptex1,SystemTrustCache, exactly as scripts/build-original-system-trust.py builds them.
# Measured: launchd's cdhash 1d52c69747dffc4b1937d241bdbc9cee3b22df18 is one of the 2478
# StaticTrustCache entries and is absent from the 76-entry SystemTrustCache.
# Since the Metal staging it is the three-module owner bundle that
# scripts/make-owner-trust-bundle.py builds: one owner module carrying the Adreno Metal
# plugin's CDHash (0d246bc7) plus the same two original modules byte for byte, which the
# script verifies against build/original-static-system-trust before writing.
trust_cache_sha256 = [
  "b5bae85925a8e78b1dda46d6cf0fb937299e38ee4059377e91c472a2ba322e0f",
]
# The panic screen and the reset probe share the zero padding after _start, and there is room for
# only one of them: two probe caves plus the 0xa0f-byte panic screen end at 0x...8fcf, 0x21 bytes
# below the PANIC_CAVE_END guard (0x...8ff0), so a third cave pushes the panic screen past it and
# scripts/patch-xnu-entry-probe.py refuses the kernel. Set panic_screen back to true to go past the
# MMU, but drop the stage 4 keys first.
#
# There is no serial console to read on this board (the ADT has no `aux` node for the only
# backend XNU compiles in, PI3_UART). The frame buffer is not reachable here either: DarwinBoot's
# video base is 0x9C000000 while the kernel's physical base is about 0xC2E04000, so the panel lies
# outside the physical map and phystokv() panics on it. Until a site past kernel_bootstrap (where
# ml_io_map works) is hooked, stage 4 reports by time: it makes the call, waits this many seconds,
# then resets. A reset means _arm_vm_init returned; no reset means the kernel died inside it.
# 22:28 read the last binary verdict this way and it was the right answer: the probe at
# _PE_init_platform call #2 reset, so PE_init_platform(TRUE) returned and the death is after
# line 590. A binary reset/no-reset cannot name that death. The panic screen can: it redirects
# panic() and the common panic funnel into a blob that draws on the kernel's own vinfo mapping.
#
# It was refused before because vinfo was still zero at the sites under test - initialize_screen()
# runs from PE_create_console() at arm_init.c:577, and the death was upstream of that. It is not
# upstream any more: the 22:28 probe proves line 590 was reached, so every remaining candidate
# (ml_map_cpu_pio, cpu_timebase_init, PE_init_cpu, fiq_context_init, the /chosen dram lookup,
# machine_startup and kernel_bootstrap) runs with a live _vinfo.
#
# The probe is dropped for this run: one panic cave and one stage-4 probe cave do not both fit in
# the padding after _start. --no-reset keeps stages 1 and 2, so the bars still prove the kernel
# reached the MMU.
panic_screen = true
# One probe, one question, one boot. A reset means the answer is yes; the verdict is read from the
# screen, not from timing: a reset drops the device back to slot b, whose ARCHIVE image draws its
# own "Failed to mount root device"; no reset leaves this image's frame frozen.
#
# entry_probe_reset_before is OFF on purpose. With it on, the cave never calls the target, so a reset
# only proved "control reached the call site" - which is what 20:35 showed for _PE_init_platform and
# what 20:39 failed to show for _ml_parse_cpu_topology. With it off the cave does `bl callee` first
# and resets after it returns, so this run answers a different question: does _PE_init_platform
# RETURN? Yes leaves the death in the configure_* block between the two call sites, no puts it
# inside _PE_init_platform.
# The identity-window fix is in the kernel, and the bars-only run at 21:44 froze on the same NEW
# frame as the 20:18 control. That frame cannot separate "fix failed" from "fix worked and the
# kernel died further on", because the frame buffer is unreachable once the MMU is on.
#
# 21:46 answered the identity-window question: the _ml_parse_cpu_topology probe DID reset (the
# screen fell through to slot b's ARCHIVE image, entry pa 0xC31EC488), where the 20:39 probe at
# the same site did not fire. The wfe_timeout_configure / wfe_timeout_init block is passed.
#
# 21:53 did the same for _arm_vm_init, the 20:28 site: it reset too. The CPU topology assert,
# the BootCpuData wiring, thread_bootstrap, cpu_bootstrap, rtclock_early_init,
# kernel_startup_bootstrap, timer_call_init, cpu_init and processor_bootstrap all ran, and
# arm_vm_init built the tables and returned.
#
# _PE_init_platform is called twice in _arm_init: FALSE at line 371 (already known to return,
# 20:46) and TRUE at line 590. The second one runs the vm_initialized branch: ml_page_protection-
# free startup, SecureDT re-init is skipped, and pe_arm_init_interrupts maps the GIC and the timer
# through ml_io_map. That is the first point where a real mapping of SoC registers happens, so a
# reset here means the interrupt controller and timer came up.
# 22:07 reset-before at _PE_init_platform call #2 did NOT reset, which settles the earlier
# ambiguity: control never reaches line 590. The death is between arm_vm_init returning
# (0x…6da4) and that site (0x…6f0c).
#
# The binary pins it down. The only occurrence of the constant 0x3C0FC000 in the kernel is at the
# top of _PE_create_console, 0xfffffff0079a61a8/61ac (movz x0,#0x8000; movk x0,#0x3c0f,lsl 16),
# immediately followed by BL ml_io_map_wcomb at 0x…61b4. That is check_for_panic_log()'s
# #ifdef PLATFORM_PANIC_LOG_PADDR branch, taken because board_config.h includes BCM2837.h for
# this target. SM8250 has nothing at 0x3c0fc000; the mapped result is dereferenced as an
# embedded_panic_header while the MMU is on and no exception vectors are installed.
#
# alioth_defconfig now sets CONFIG_XNU_DT_PANIC_REGION=y, which selects the device-tree branch,
# and the ADT has no pram node, so the function returns without mapping. The probe is dropped so
# this run can show how far the kernel gets with that out of the way.
# entry_probe_reset_after = "_PE_init_platform"
# entry_probe_reset_occurrence = 2
# entry_probe_reset_in = "_arm_init"
# entry_probe_reset_delay = 10
kernel_args = [
  "-v",
  # The persistent log header carries this string, so a log read back through TWRP can say which
  # image wrote it. It was empty on every round up to usb171, which made the recovered log unable
  # to identify itself. Bump it with the image name on each build.
  "sheng-build-tag=u224",
  "serial=3",
  "debug=0x14e",
  "kt_fixed_zones=120",
  "armcpu-diagnostics=1",
  # Secondary CPUs. Without these the kernel runs uniprocessor: ArmCpu.cpp only issues a PSCI
  # CPU_ON when sheng-smp is non-zero, and the panel has been reporting
  # "SMP req=0 run=0 cond=0 boot=0" on every boot so far, so all 146 processes of the startup
  # queue on one core. The reference board (UniXNU-sheng/board.toml) passes both of these and
  # boots with eight cores. armcpu-spi-ipi routes inter-processor interrupts through the GIC's
  # SPI, which is what that board needs; it is added here with sheng-smp together because they
  # were qualified as a pair, and armcpu-diagnostics stays on so the SMP step counters report
  # each stage of the bring-up on the panel and the console.
  # Secondary cores, per the reference board's own arguments (UniXNU-sheng/board.toml).
  # Re-enabled 2026-10-28: the only earlier attempt (boot-usb47) stalled, which was first
  # misread as a KPP panic and then traced to the second RPMh vote blocking 83 s in
  # IODelay -- a stall the spin fix in AliothRpmhPort has since removed. ArmCpu is already
  # a selected component and sheng-smp is its documented boot argument, so no porting is
  # involved. armcpu-diagnostics stays on so the SMP step counters report on the panel.
  # On 2026-10-28 two independent runs froze at the same point: boot-usb47 (SMP plus the
  # RPMh/touch path) and boot-usb63 (SMP plus CPU frequency and the touch health check) both
  # stopped the log immediately after the touch rail's second RPMh vote. boot-usb48 through
  # boot-usb62 booted with the same touch and RPMh code and SMP off, so SMP is the remaining
  # variable.
  #
  # Off again for boot-usb68: the touch gate is a behaviour change and the SMP trace is an
  # observation, and shipping both at once makes an abnormal boot impossible to attribute.
  # The next SMP run also adds armcpu-self-ipi=1. ArmCpu.cpp:34 records that an SGI does not
  # reach this board's cores and IPIs are software-pended SPIs, and XNU only enables a core's
  # IPI after that core has taken one, so each core signals itself in initCPU; that code is
  # already in the pinned ArmCpu and the reference board passes the argument for it.
  # boot-usb75: the one variable is SMP itself. The touch path is now known good (boot-usb74:
  # contacts 4, hid 2012), so it stays on; the earlier freezes were traced to the RPMh vote
  # stalling 83 s in IODelay, which AliothRpmhPort no longer does. armcpu-self-ipi is added
  # because ArmCpu records that an SGI does not reach these cores and IPIs are software-pended
  # SPIs, and XNU only enables a core's IPI after that core has taken one, so each core has to
  # signal itself. It is a component argument, not one of the documented boot arguments, and is
  # recorded as such in porting.toml.
  "sheng-smp=1",
  "armcpu-spi-ipi=1",
  "armcpu-self-ipi=1",

  # CPU frequency: vote each EPSS domain its highest non-turbo level. The register interface is
  # the same qcom-cpufreq-hw-epss one the reference board uses; the kona addresses and the 4/3/1
  # domain CPU counts are this board's own (kona.dtsi:325-330). The probe reports its state on
  # panel row 39 (native_cpufreq_row); mode 3 votes every domain that reads enabled.
  "sheng-cpufreq=3",
  "sheng-pmgr=2",
  "-no_slto_panic",
  "ml-timeout-lock-panic-scale=40",
  # NativeUfs defaults to stream 0x60, which is sheng's board. SM8250 routes the
  # UFS host through 0x0e0 and 0x4e0.
  "native-ufs-stream=0xe0",
  "native-ufs-stream2=0x4e0",
  # The driver's admission gate (NativeUfs.cpp start()): without this the root-device
  # personality returns before it touches the controller, so no IOMedia is ever published and
  # IOFindBSDRoot waits ROOTDEVICETIMEOUT ten times and panics. It is the same key sheng sets.
  "native-ufs-root=1",
  # Stops the watchdogd panic without touching the kernel. Measured on hardware (2026-10-26,
  # second panic screen): watchdogd[107] executed BRK #1, the kernel raised SIGTRAP (namespace 2
  # subcode 0x5), and com.apple.watchdogd.plist sets _PanicOnCrash {PanicOnConsecutiveCrash:
  # true}, so that one crash panicked the kernel. The cause is that watchdogd wants a Data volume
  # in the root volume group, while this root is NativeUfs and the Data seed is a separate 32 MiB
  # NativeRamBlock container whose volume reports "No specific role"; the supplied OS image has
  # no Data volume at all (044-76040-038.dmg holds disk11s1, Role System, only).
  # kern_exit.c declares panic_on_crash_disabled as TUNABLE(bool, ..., false) and
  # proc_should_trigger_panic() returns false on it before it reaches the
  # POSIX_SPAWN_PANIC_ON_CRASH branch that _PanicOnCrash takes. watchdogd still crashes, and the
  # kernel then prints "panic-on-crash disabled via boot-arg" and keeps running.
  # This is the bring-up answer, not the qualified one: it suppresses every job's crash panic,
  # launchd included, so initproc's own exit no longer stops the boot either.
  "panic_on_crash_disabled=1",
  # Records whether the prelinked apfs kext loads offline. The gate is in bsd_init.c's
  # #if DEVELOPMENT || DEBUG native_apfs_load_probe(): without this key it returns before
  # calling OSKextLoadKextWithIdentifier, so native_apfs_load_status stays -1. The kext itself
  # starts through the prelink path either way - probe 12 already showed its media
  # (Content 41504653/EF57347C), so this key is for the checkpoint value, not for availability.
  # sheng sets it, and so does this board now.
  "offline-apfs-load=1",
  # The GOP display path. Each key is read by drivers/GopFramebuffer/NativeLegacyDisplay.cpp
  # or by kits/alioth/LegacyDisplayProbe.cpp, not by a board file, so the list is those two
  # files' documented interface:
  #   offline-mobile-graphics-load=1 gates native_mobile_graphics_load_probe() in bsd_init.c.
  #                              Without it that function returns at its first line
  #                              (offline-component-load-probes.patch:545), so neither
  #                              native_legacy_display_probe() nor anything after it runs and
  #                              every offline-legacy-* key below does nothing. It also loads
  #                              com.apple.iokit.IOMobileGraphicsFamily; that identifier is one of
  #                              the kernel's 30 prelinked components, so the load returns
  #                              success without user space.
  #   offline-legacy-pm=1        runs the logical power-management lifecycle in startDisplay().
  #                              validateSwap() and kickOnce() both require logicalPM, so without
  #                              it the display maps, registers and sends vsyncs but no swap is
  #                              ever accepted or copied: no frame reaches the panel. It also
  #                              requires offline-legacy-phase=4, which is set below.
  #   offline-legacy-register=1  lets registerService() publish the display. Without it the
  #                              owned registerService() calls native_legacy_backend_guard(84)
  #                              and panics with the lifecycle point, which is the intended
  #                              behaviour for an unpublished backend, not a bring-up state.
  #   offline-legacy-gop=1       lets startHardware() map the firmware framebuffer. Without it
  #                              startHardware() returns false and no scanout buffer is installed.
  #   offline-legacy-phase=4     selects the attach-to-device-tree branch that probe() and start()
  #                              take, and is also the phase the unit-scale policy requires.
  #   offline-legacy-validate=1  accepts a submitted swap surface. Without it every swap is
  #                              rejected at validation and nothing is ever presented.
  #   offline-legacy-transfer=1  performs the CPU copy into the scanout buffer. Without it the
  #                              validated swap is never transferred, so no frame reaches memory.
  #   offline-legacy-cpu-present=1 retires the swap after the copy. Without it the client's wait
  #                              never completes and the compositor stops after one frame.
  #   sheng-vsync=60             arms the work-loop refresh tick. The GOP scanout has no vblank
  #                              interrupt, and no platform subclass calls the original vsync
  #                              sender, so without this the render server never receives a vsync
  #                              message and CoreAnimation cannot present its first frame. 60 is
  #                              this panel's rate; the component rejects 0 and anything over 240.
  #   offline-legacy-verdict=1   makes a failed path in LegacyDisplayProbe.cpp panic with its
  #                              stage instead of returning silently. This board has no serial
  #                              console, so without it a failure and "the probe never ran" look
  #                              the same: the panel keeps the DarwinBoot frame either way. A
  #                              panic screen naming the stage is the only per-flash evidence.
  #                              Success does not panic; it is read from the panel.
  #   offline-legacy-reached=1   paints a yellow band at the top of the panel as the first act of
  #                              native_legacy_display_late_probe(), before any test can return.
  #                              Band 3 of 16: below DarwinEnter's green band and the entry
  #                              probe's blue and magenta ones, so all four can be read from one
  #                              photograph. A yellow band proves bsd_autoconf reached the late
  #                              probe and that the kernel can still write the frame buffer; no
  #                              band proves the kernel stopped before that call. This separates
  #                              the two cases the verdict argument cannot, because a kernel that
  #                              died earlier never reaches any verdict site either.
  #                              The same switch also paints the userspace ladder, bands 4 to 6,
  #                              from three call sites the offline-userspace-ladder patch adds:
  #                                band 4 cyan   the first bsd_ast fired, so bsd_init() finished
  #                                band 5 orange load_init_program was entered
  #                                band 6 red    process 1's execve returned 0
  #                              One photograph then separates the three cases that all look
  #                              identical on a panel that never changes: no band 4 means the
  #                              kernel never left bsd_init; bands 4 and 5 without 6 put the stop
  #                              in the exec path (AMFI, trust cache or union mount); all three
  #                              mean userspace started and the remaining silence is the
  #                              compositor's, not the kernel's.
  #                              Bands 8 and 9 report the display backend itself, which bands 3
  #                              to 6 cannot because the kernel paints those alone:
  #                                band 8 purple a client submitted a swap
  #                                band 9 white  the transfer wrote the scanout buffer
  #                              Band 8 without 9 means a client exists and its frames were
  #                              refused or never copied, so the fault is in the validator or
  #                              the transfer, not in a missing client. Neither band means no
  #                              client reached this backend at all.
  "offline-mobile-graphics-load=1",
  "offline-legacy-pm=1",
  "offline-legacy-register=1",
  "offline-legacy-gop=1",
  # Phase 3 (presenter only) was tried on 2026-10-29 to get a frame counter: the boot stops
  # after the touch probe with no fastboot, no adb and no console output, and needs a power
  # cycle. The frame-rate instrument has to come from the phase-4 path instead.
  "offline-legacy-phase=4",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1",
  "offline-legacy-verdict=1",
  "offline-legacy-reached=1",
  # offline-legacy-dump-at is gone. It gated native_legacy_dump_state(), which was removed when
  # the cell painter replaced the panic dump, so the argument had been a dead key: present on the
  # command line, read by nothing. The text channel below replaces it properly.
  "sheng-vsync=60",
  # sheng-lite and sheng-disable-watchdogd come from the working port. Both are parsed by
  # package/BootWatchdogPolicy.c, whose only call site is inside `#if XNU_BOOT_PROGRESS` in
  # load_init_program, so they did nothing until alioth_defconfig turned that option on.
  # sheng-lite stops the jobs that only reach for the network, iCloud or the photo library and
  # have nothing to do on a tablet with no radios and no accounts; sheng-disable-watchdogd stops
  # watchdogd, which on this board asserts because the Data volume has no role. A 2026-10-26
  # measurement found processes dying with libsystem faults and fewer than ten alive, which is
  # the shape a daemon asserting on a missing service takes.
  "sheng-lite=1",
  # liveactivitiesd is the one service that still fails deterministically: measured
  # 2026-10-27 on boot-usb31, 6 aborts with BRK #1 inside CalendarUIKit. There are no
  # accounts and no network here, so live activities have nothing to do. cryptexd was
  # in this list during the Data-mount fault and is left out now: once the volume
  # mounted, it stopped crashing on its own.
  # routined keeps aborting here: measured 2026-10-27, SIGABRT (status=6 ns=2) and several
  # successive pids in one window. It drives location and routine learning, and this board has
  # no GNSS and no accounts, so it has nothing to do.
  "sheng-disable-jobs=com.apple.liveactivitiesd,com.apple.cryptexd,com.apple.routined",
  # Unattended loop, on for the return-path round. Measured 2026-10-27 in an earlier round:
  # sheng-autoreset fires and the kernel restarts, but it comes back to the kernel rather than to
  # fastboot, exactly as the control-channel REBOOT does. BootReset writes the IMEM cell with
  # ml_io_map_unmappable and this module used ml_io_map, so the mapping attributes are not the
  # difference; either the address, the value, or the medium the bootloader reads is wrong.
  # That round is the only observation so far, and it is not clear the writer thread was running
  # through it, so the persistent log has to record the reset before the reading is trusted.
  # The timer lives in the writer thread, so it needs sheng-log=1 further down this list.
  # 120 s, not 150: measured on boot-usb102 the desktop is up well before 150, and an
  # unattended run has nobody to touch the panel, so the reset should not wait past the
  # desktop. The timer counts from the writer's own start, a few seconds after boot.
  "sheng-autoreset=3600",
  # boot-progress=2 is the text channel this board has been missing. package/BootProgress.c
  # binds the frame buffer returned by PE_current_console and draws a 48-row by 120-column text
  # page on it; opt 2 means continuous, so the page keeps updating instead of stopping after the
  # first stage. It does NOT panic, so the hardware watchdog cannot reset the panel and erase it,
  # which is what defeated three earlier attempts to read a panic dump.
  # The working port sheng passes the same argument. It is also the only channel that carries
  # what a colour band cannot: kern_exit.c:1901 already calls
  # boot_progress_exit(pid, p_name, rv, namespace, code) for every exiting process, and
  # BootProgress.c stores and renders those records. That is the pid, the name and the reason,
  # which is exactly what the exit loop investigation is missing.
  # 1 would be a one-shot page; 2 keeps it live. Any other value disables the layer.
  # Off: the page drew continuously into the console frame buffer, so its text stayed
  # visible at the edge of the desktop after the renderer came up. The serial console and
  # the persistent log carry the same rows.
  "boot-progress=2",
  # boot-diag-resume=<seconds> let the diagnostic page take the panel back that long after
  # scanout stopped. Measured 2026-10-27 on boot-usb33: SpringBoard reached the lock screen, but
  # this page took the panel back every time the renderer paused for ten seconds, so the desktop
  # appeared and vanished in alternation. Dropped on 2026-10-29: resume_after is file-scope zero
  # and BootProgress.c:635 only writes it when the argument is present and in range, so the
  # argument repeated the default and the command line needed the room for sheng-banner=0.
  # qcom-usb-debug=1 starts the CDC-ACM console over the board's DWC3 controller. It tees
  # printf, IOLog, kprintf and the panic drain onto a USB serial port, so the log can be read
  # live on the host instead of photographed off the panel. The firmware already brings the
  # controller up (uefi-alioth DXE) and this kernel has no other USB driver, so nothing competes.
  # qcom-usb-ctl=1 adds the two-way control channel the host scripts use for status and reboot.
  # Expected: the host sees 1209:316d as "QcomXnuUsbDebug" and the diagnostic page prints
  # "QCOM USB WORKER active". If a precondition fails the page prints
  # "QCOM USB WORKER unavailable phase=%u error=%u" and the enum names which one.
  "qcom-usb-debug=1",
  "qcom-usb-ctl=1",
  "sheng-disable-watchdogd=1",
  # native-touch=1 starts the FocalTech FT5652 probe from
  # native_legacy_display_late_probe(). The driver is compiled into every image; this argument
  # only decides whether it runs. It maps six register windows, votes the GCC clocks and starts
  # its own thread, so it is opt-in: without the argument the boot is the configuration that
  # holds the lock screen, and a regression in the touch path cannot cost that.
  # Expected console line: "TOUCH start=1"; the panel rows 42/43 then carry the HID counters.
  # H1 probe: does the touch probe's RPMh L11C vote, made concurrently on another core, take
  # the USB PHY rail down? The CDC device leaves the bus at t~5 s, which is when that vote runs.
  # Touch is off for this round only.
  "native-touch=1",
  # The HID half. NativeHidInput only registers the touch sink when this argument is 1
  # (ShengHidInput-*/NativeHidInput.cpp:291,303); without it the frame loop reads contacts and
  # drops them, because publish() finds no sink. Measured 2026-10-28 on boot-usb57: the probe
  # started (TOUCH start=1) and the desktop came up, but nothing reached the system.
  # The reference board passes the same argument.
  "sheng-touch-hid=1",
  # Publishes the digitizer as its own IOHIDDevice, the way the reference board does. The
  # combined device has never reached the window server here: reports are attempted (hid
  # rises), handleReport refuses them (hres=1), and edge still counts real touches. The
  # driver already implements the split (NativeHidInput.cpp setTouchOnly /
  # native_hid_touch_allocate); this argument is the only thing that was missing.
  # Off for this round: the reference board (sheng, pipa) does not split the digitizer, and
  # splitting here creates a second Touch Screen while the sink is a global singleton, so the
  # merged device stops publishing and whichever one the window server bound to may be the dead
  # one. The merged device now has the per-driver edge hook and the area filter.
  # "sheng-touch-split=1",
  # pipa-gpu=<mode>: the A650 probe. Mode 1 only reads -- the GPU's clock sources in the
  # global clock controller and the fuses that say which part this is -- so a wrong address
  # cannot wedge the kernel and the route can be checked before anything is written.
  # Mode 6 adds CX power-on, the GPU SMMU clock and the 200 MHz GMU clock. Judgement line:
  # "GPU m1 gcc=ok cc=ok smmu=ok gpu=ok io=0".
  "pipa-gpu=12",
  # The PCIe controller steps; step 1 only reads, criterion gcc pcie_0_gdscr = 0x22f001.
  # Mounts the payload addon; the wallpaper overlay arrives through it.
  "sheng-gpu-addon=1",
  # The display hand-off (NativeGOPPresenter.cpp:94): with it the composited frame is offered to
  # the privileged GPU client instead of being copied by the CPU. The live row's swap counter
  # (sc) has not moved without it, so the desktop may be compositing and never presenting.
  # The tag is shortened to u208 because the command line is at 983 of its 1000 bytes.
  "sheng-fb-gpu=1",
  # SpringBoard traps with SIGTRAP at the same address on every boot, and that assertion is the
  # first candidate for a missing capability: the plugin withholds every Apple GPU family by
  # default, so Metal answers "none" to a question an app may assert on. none reports them.
  # The pcie probe arguments are off for these rounds to keep the command line under 1000 bytes.
  "pipa-metal-withhold=none",
  # Starts the HID publisher itself. The publisher is an IOHIDDevice compiled into this kernel,
  # so IOKit has no personality for it and nothing matches it; the board calls it from
  # native_legacy_display_late_probe, the second of the two start paths the driver adaption
  # guide names. Without this argument the object is linked but never started, which is what
  # every image up to boot-usb73 did: contacts arrived and no report was ever published.
  "offline-hid-input=1",
  # Screenshot registration. Proven harmless on boot-usb87: the home screen appeared at ~88 s
  # with it enabled, and no capture had even been requested. Kept on so the frame buffer can be
  # read back over the control socket once the USB link is stable.
  "offline-screenshot=1",
  # The AppleKeyStore stand-in and its key-event path. Without a keybag the post-restart lock
  # screen asks for a passcode nothing can satisfy; this pair makes the owned AppleKeyStore
  # answer "no passcode, nothing locked". Add sheng-aks-sls=3 only if the prompt survives.
  "offline-key-events=1",
  "sheng-aks=1",
  # Measurement round for the unattended loop: the whole scheme depends on the board returning
  # to fastboot by itself, and nothing has ever confirmed that it does. Sixty seconds is short
  # enough to stand in front of the phone and long enough to be past the console coming up.
  # On for the return-path test. boot_reset_mark_bootloader(), the watchdog and the timed
  # reset all sit behind this one argument, so with it commented out there was nothing to
  # observe: "no reset at 150 s" was never evidence.
  # "sheng-autoreset=150",  # gated behind sheng-log
  # One measurement round before any frame is trusted. Every frame read so far returned a
  # payload of all 0xFF with a matching CRC, which is the part's "no valid data" answer, and
  # GPIO 39 has never gone low. That leaves two very different causes: the sensor sees no
  # touch, or it sees one and the report never reaches the host. native-touch-diag=1 resets
  # the part, waits as long as the board's own driver waits, then spends thirty seconds
  # reading only the interrupt counter 0x8F and its neighbours, with no frame read at all,
  # and afterwards prints the CRC trailer next to every frame it does read. Hold a finger on
  # the panel for the whole thirty seconds. Drop this argument once the numbers are recorded.
  # iPadOS 17 roots from a read-only System volume plus a writable Data volume in one APFS
  # volume group. There is no SEP and no hardware keybag on SM8250, so keybagd takes its
  # shared-Data allow-list path only when this argument is present. Nothing in this kernel
  # parses it (no occurrence of the string in kernel.macho); userspace reads it from
  # kern.bootargs. probe-keybag-bypass.py qualifies the same argument offline.
  "-apfs_shared_datavolume",
  # The timed reset and the reset probe both live inside the persistent-log writer thread, and
  # that thread only starts when sheng-log=1. With sheng-autoreset alone nothing watches the
  # deadline: "no reset at 150 s" was the writer never having started, not the reset path
  # failing. The official unattended example passes both arguments together.
  "sheng-log=1",
  # The on-screen diagnostic banner paints its rows straight into the frame buffer every 30 ms.
  # Until the GPU composites, nothing else draws, so it was the only live view; with the GPU
  # publishing and a wallpaper to judge, it paints over the frames it is meant to help read and
  # costs CPU on a machine with no acceleration yet. The rows still reach the serial console and
  # the persistent log (sheng-log=1 above), so nothing is lost. boot-progress=0 is not the
  # switch for this: it turns the page and the log thread off together.
  "sheng-banner=0",
  # boot-usb99 was the first image that passed this pair, and it faulted in the writer's
  # read-back of the previous run: the header struct was handed straight to a block-addressed
  # read, which copied 4096 bytes into a 152-byte stack object and ran into the guard page
  # (pc in memcpy, lr in hostRead4k, far = sp + 0x3b0). The read-back now goes through
  # native_ufs_log_read_bytes, so the boot below is the first that can reach the timed reset.
  # "sheng-autoreset=180",
]

[payload.adt]
chip_id = "0x164"
owned_memory_size = "0x100000000"
# The Data seed is dense. scripts/prepare-owner-data-fixture.py:62 requires its output to be a raw
# Packed, and deliberately so. The Data volume was a dense 32 MiB APFS container, and
# measured 2026-10-27 the userspace ran out of room on it: profiled aborted with
# "Unable to take PCDistributedLock at path
# /var/mobile/Library/Caches/.com.apple.persistentconnection.settings.lock.lock:
# No space left on device", and cryptexd aborted 23 times with mkdirat ENOSPC.
# df reported 31 MiB free, which is what an APFS container this small reports before its
# own reserve policy refuses an allocation.
#
# The seed is now 3 GiB logical, packed to 1.2 MB because only six pages are non-zero, so
# it still fits the 192 MiB boot partition. scripts/seed-data-grow.py produced it from the
# 32 MiB container, which keeps the volume UUID and therefore the defconfig value.
# CONFIG_XNU_NATIVE_RAM_BLOCK is on, so the kernel reads the DBRDISK1 extent table.
packed_data_ramdisk = true
# "required" is deliberate, not an unreplaced placeholder: payload.py reads the seed only
# from --unique-chip-id or UNIXNU_UNIQUE_CHIP_ID (scripts/unixnu/payload.py:120), and
# devicetree.py writes the platform identity only from that argument. Putting a literal here
# would silence the error and then silently drop /chosen/unique-chip-id and chip-id, because
# neither file falls back to this field. Every build passes the value on the command line.
unique_chip_id = "required"
# IOFindBSDRoot selects its root media by three predicates, in order: rd=/rootdev= on the
# command line, /chosen/root-matching, /chosen/boot-uuid, and only then a fallback of
# IOProviderClass=IOMedia + Content="Apple_HFS" (IOKitBSDInit.cpp:781-928). This board carries
# none of the first three, and no media here is Apple_HFS - the APFS container is EF57347C/
# 7C3457EF and the APFS volume is 41504653 - so the fallback can never match and the kernel
# panics at line 984 after ten ROOTDEVICETIMEOUT rounds. This writes /chosen/root-matching as
# {"IOProviderClass":"IOMedia","IOPropertyMatch":{"UUID":<OS volume>}} (devicetree.py:294-297),
# which the parser accepts as a bare <dict> (OSUnserializeXML.y:217-229).
# The value is the OS window's own volume UUID, recorded by build/verified-root-os/verification.json.
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"

# Device identity. The panel is 1080x2400 (20:9), so an iPad identity would make UIKit lay out
# a 4:3 interface and distort it. The supplied image accepts a phone identity: SpringBoard.app's
# Info.plist declares UIDeviceFamily = [1, 2] (1 = iPhone, 2 = iPad), so iPhone10,3 is a family
# this image already supports. iPhone10,3 (D22) is 1125x2436 at 19.5:9, the closest shape the
# 21H461 resource set carries to this panel.
#
# These tables are top-level [adt.*], not [payload.adt.*]. devicetree.generate() reads two
# different tables: platform = config['adt'] supplies the ADT property nodes below, while
# options = config['payload']['adt'] carries only the DarwinBoot switches (chip_id,
# owned_memory_size, packed_data_ramdisk, root_match_volume_uuid, unique_chip_id). Writing the
# identity under [payload.adt] silently did nothing and left the os profile's iPad7,1 / J120 /
# artwork-device-idiom "pad" in place.
# profiles.merge() is a recursive dict merge, so these keys overlay the profile's one by one.
# A list value needs the plural "strings" kind: typed_properties() calls value.encode() on the
# singular "string" branch and a list has no encode().
[adt.root.string]
model = "iPad7,1"
target-type = "J120"

[adt.chosen.u32]
display-scale = 3

[adt.product.string]
product-name = "iPad Pro (12.9-inch) (2nd generation)"
product-description = "iPad Pro (12.9-inch) (2nd generation)"
artwork-device-idiom = "pad"

[adt.product.u32]
artwork-device-subtype = 2732
artwork-scale-factor = 3

# home-button-type 2 is the gesture-only case: the lock screen then offers the swipe-to-unlock
# gesture and draws the home indicator, instead of expecting a physical Home button.
[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2

[device_tree]
source = "device:dts/alioth.dts"
include_dirs = ["soc:dts"]
