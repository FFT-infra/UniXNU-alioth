# Board description of the Xiaomi Pad 6 (pipa, SM8250), read by the unixnu build driver.
#
# Prepared without the tablet: every value names its public source and none has been observed through UniXNU on a
# pipa yet. The memory banks and [userdata] were read from the tablet under Android (android-devinfo, 2026-10-21).

[board]
name = "pipa"
soc = "SM8250"
description = "Xiaomi Pad 6"
kit = "pipa"                       # a package/ of this repository would appear as kits/pipa in the build tree

# The same target OS image as UniXNU-sheng: the unchanged iPad7,1 iPadOS 17.7.11 restore image.
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

# Android's userdata (sda34 on the UFS LUN 0, 106.6 GiB), from the tablet's GPT, which agrees with sysfs. "unixnu build
# userdata" writes the image for it; flashing it erases Android's data. The windows are those of UniXNU-sheng: the same
# target image.
[userdata]
first_lba = 0x293000
last_lba = 0x1d387fa
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "pipa_defconfig"
# Archive builders of the kernel step, in order; the ones pipa_defconfig links. build-arm-driver.py is the generic
# driver builder of UniXNU-sheng.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-arm-driver.py NativeAES",
  "build-native-aes-bindings.py",
  "build-libpthread-kernel.py",
  "build-link-stubs.py",
  "build-platform-power.py",
]

# The same original kernelcache and prelink selection as UniXNU-sheng: the target image is the same.
[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
]

# The firmware is the Mu-Silicium pipa port (pipaPkg, Kona SM8250) of the uefi-pipa checkout, with UniXNU, the ramdisk
# block device driver and DarwinBoot added. It keeps the upstream vendor driver set, which upstream lists as working for
# display, internal storage and the side buttons.
[firmware]
config = "pipa"                    # Resources/Configs/pipa.toml in the Mu-Silicium checkout (--uefi or UNIXNU_UEFI)
dsc = "Platforms/Xiaomi/pipaPkg/pipa.dsc"
fd = "Build/pipaPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/check-pipa.py"]   # reads the checkout from UNIXNU_UEFI
submodules = ["Binaries", "Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
# Masks a GIC interrupt that has no handler instead of taking it forever (found on sheng with a leftover IPCC interrupt).
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "pipa-research"

# Image parameters come from Resources/Configs/pipa.toml of the checkout. Resources/DTBs/pipa.dtb already carries
# /reserved-memory/cont_splash_region@9c000000, so no [[bootimg.dtb_node]] is added.

# The ramdisk of the boot image: a FAT volume with the UniXNU config, the kernel, its device tree and the optional
# trust cache and Data seed. DarwinBoot is part of the firmware volume.
#
# The kernel is the one pipa_defconfig builds. It has no storage, Data or display driver yet, so the expected end is the
# root mount, with the kernel log on the frame buffer.
[payload]
volume = "PIPAESP"
size_mib = 192
loader = "firmware"
title = "pipa first boot: source 4K XNU to the panic screen"
# This tablet was upgraded to 16 GB. Android's /memory has the banks 0x80000000+0x37700000, 0xc0000000+0x1c0000000 and
# 0x800000000+0x200000000: the added 8 GiB is a bank of its own at 32 GiB. XNU takes dram-base and dram-size as one
# range (is_dram_addr, which only picks the attribute of device mappings), so it spans from the base to the end of the
# last bank; every register block lies below 0x80000000.
dram_size = "0x980000000"
skip_setup_tool = "scripts/seed-data-skip-setup.py"
panic_screen = true                  # patch panic() screen output into the payload copy of the kernel
# The original static/System trust caches of the same IPSW, as accepted by UniXNU-sheng.
trust_cache_sha256 = [
  "7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7",
  "8900d6a93d7a59ce1a872a5c081e559f4240a218f97e12d44d22dda46644d68f",
]
# The generic arguments of the sheng image that apply to this kernel. The display, HID, boot progress and sheng-*
# arguments belong to components pipa_defconfig leaves out; armcpu-spi-ipi is an SM8550 quirk. sheng-pmgr=2 publishes
# the original PMGR nub through the bridge, which reads and writes no hardware.
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "kt_fixed_zones=120",
  "armcpu-diagnostics=1",
  "sheng-pmgr=2",
  "-no_slto_panic",
  "ml-timeout-lock-panic-scale=40",
]

[payload.adt]
tool = "scripts/make-pipa-adt.py"
chip_id = "207"
# 4 GiB, as the iPad7,1. DarwinBoot takes the first free run of the firmware's map that holds it; Android finds
# 0xffc20000..0x27fffffff (6 GiB) free in the second bank, and the third bank has 8 GiB.
owned_memory_size = "0x100000000"
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"   # the OS volume of the same IPSW
cpu_regs = "0"                       # the boot CPU only; all eight are 0,0x100,0x200,0x300,0x400,0x500,0x600,0x700
packed_data_ramdisk = true
ipad_identity = true
unique_chip_id = "required"          # the platform seed is not stored in any repository
