schema_version = 2

[board]
name = "alioth"
soc = "SM8250"
soc_source = "sm8250"
os_profile = "ipados-17.7.11-21H461"
description = "Xiaomi Redmi K40 (alioth, M2012K11AC)"
kit = "alioth"

[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "ShengUfs", "VirtioMmioBlock", "RamBlock", "XnuPrelink", "DarwinBoot", "AppleKeyStoreState"]

[userdata]
# Android's userdata on UFS LUN 0, read from the phone's GPT.
first_lba = 0x2a8000
last_lba = 0x3b037fa
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "alioth_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8250.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "component:ShengUfs",
  "component:VirtioMmioBlock",
  "component:RamBlock",
  # Out for stage 2. Both bindings steps read build/storage-abi/interface-audit.json, which
  # audit-storage-interface.py derives from a live GDB stop on hardware. alioth
  # leaves CONFIG_XNU_NATIVE_VIRTIO_BLOCK and CONFIG_XNU_NATIVE_RAM_BLOCK unset,
  # so the objects these bind never link.
  # "build-virtio-mmio-bindings.py --component VirtioMmioBlock",
  # "build-virtio-mmio-bindings.py --component RamBlock --directory build/ram-block",
  # The OS profile sets CONFIG_XNU_SOURCE_MOCKFS, and build-xnu-4k-baseline.sh:739
  # force-loads build/mockfs-fixture/libmockfs_fixture.a when it is on. Only this
  # archive builds that library, so it must stay in the list.
  "build-mockfs-fixture.py",
  "build-platform-power.py",
  # Ported for stage 4: reads the device package (kits/<kit>) and this board's
  # Mu-Silicium checkout instead of kits/sheng and uefi-sheng.
  "build-boot-progress.py",
  "build-link-stubs.py",
  "build-libpthread-kernel.py",
  "component:AppleKeyStoreState",
  # "build-gop-legacy-display.py",
]

[firmware]
config = "alioth"
dsc = "Platforms/Xiaomi/aliothPkg/alioth.dsc"
fd = "Build/aliothPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/check-alioth.py"]
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "1"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "alioth-research"

[payload]
volume = "ALIOTHESP"
# boot_a and boot_b are 192 MiB (0xC000000). A 192 MiB FAT ramdisk plus the
# boot shim, the firmware volume and the appended device tree does not fit;
# 184 MiB also leaves less than the required 8 MiB safety margin. 176 MiB is
# the value the archived alioth port booted on hardware.
size_mib = 176
loader = "firmware"
title = "Boot"
# The board's DRAM from 0x80000000 to the end of the last bank.
dram_size = "0x200000000"
skip_setup_tool = "scripts/seed-data-skip-setup.py"
panic_screen = true
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "kt_fixed_zones=120",
  "armcpu-diagnostics=1",
  "sheng-pmgr=2",
  "-no_slto_panic",
  "ml-timeout-lock-panic-scale=40",
  # NativeUfs defaults to stream 0x60, which is sheng's board. SM8250 routes the
  # UFS host through 0x0e0 and 0x4e0.
  "native-ufs-stream=0xe0",
  "native-ufs-stream2=0x4e0",
  # The unattended-test pair (package/BootLog.c). sheng-log=1 starts the UFS log writer
  # once the monitor ticks; sheng-autoreset=<seconds> writes the IMEM restart reason and
  # resets, so a run comes back to fastboot on its own. Both are read by BootLog.c, which
  # keeps its upstream argument names until the reader side is ported (PLAN 1.5.6).
  "sheng-log=1",
  "sheng-autoreset=180",
]

[payload.adt]
chip_id = "0x164"
owned_memory_size = "0x100000000"
# The Data seed is dense. scripts/prepare-owner-data-fixture.py:62 requires its output to be a raw
# APFS container (NXSB at 0x20, no DBRDISK1 header), so the ADT must reserve RAMDisk, not
# PackedRAMDisk. DarwinBoot refuses a mismatch at DarwinBoot.c:558 with EFI_COMPROMISED_DATA.
# Packed is not reachable here yet either: alioth leaves CONFIG_XNU_NATIVE_RAM_BLOCK unset, so
# nothing in this kernel reads a DBRDISK1 extent table.
packed_data_ramdisk = false
unique_chip_id = "required"

[device_tree]
source = "device:dts/alioth.dts"
include_dirs = ["soc:dts"]
